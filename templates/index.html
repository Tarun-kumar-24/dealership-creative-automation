<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dealership Creative Automation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b, #111827);
            color: white;
            min-height: 100vh;
            padding: 30px;
        }

        
        .container {
            max-width: 900px;
            margin: auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
        }

        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: #38bdf8;
            font-weight: 700;
        }

        .header p {
            margin-top: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }

        
        h2 {
            margin-bottom: 10px;
            font-size: 16px;
            color: #e2e8f0;
            font-weight: 600;
        }

        
        select,
        input[type="file"] {
            width: 100%;
            padding: 14px;
            margin: 10px 0 22px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 14px;
            box-sizing: border-box;
        }

        select option {
            color: black;
        }

        
        .dealers-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .dealer-item {
            background: rgba(255,255,255,0.07);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.10);
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            font-weight: 500;
        }

        .dealer-item:hover {
            background: rgba(56, 189, 248, 0.18);
            border-color: #38bdf8;
            transform: translateY(-3px);
        }

        
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }


        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: #e2e8f0;
        }

        .checkbox input {
            width: auto;
            transform: scale(1.1);
        }


        button {
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(59,130,246,0.25);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 14px 30px rgba(59,130,246,0.35);
        }


        @media (max-width: 768px) {
            .container {
                padding: 22px;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Dealership Creative Automation</h1>
        <p>Generate automated creatives for Instagram formats</p>
    </div>

    <h2>Select Account</h2>
    <select id="account"></select>

    <h2>Select Dealers</h2>
    <div id="dealers" class="dealers-box"></div>

    <h2>Upload Background</h2>
    <input type="file" id="bg" accept="image/*">

    <div class="actions">

        <label class="checkbox">
            <input type="checkbox" id="useLogo">
            Use Logo
        </label>

        <button onclick="generate()">Generate Creative</button>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
