<!DOCTYPE html>
<html>
<head>
    <title>Creative Tool</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin-bottom: 30px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        h2 { color: #333; }
        select, input { padding: 8px; margin: 5px 0; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .options { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px; }
        .radio-group { display: flex; align-items: center; gap: 5px; }
        .error { color: red; margin-top: 10px; }
        .success { color: green; margin-top: 10px; }
    </style>
</head>
<body>

<h1>🎨 Creative Generation Tool</h1>

<div class="section">
    <h2>Select Account</h2>
    <select id="account" name="account"></select>
</div>

<div class="section">
    <h2>Select Dealers</h2>
    <div id="dealers"></div>
</div>

<div class="section">
    <h2>Logo & Panel Selection</h2>
    <p><em>Select a dealer to choose logo and panel</em></p>
    
    <div id="selectionUI" style="display:none;">
        <div>
            <h3>Select Logo</h3>
            <div id="logos" class="options"></div>
        </div>
        
        <div>
            <h3>Select Panel</h3>
            <div id="panels" class="options"></div>
        </div>
        
        <button onclick="saveSelection()">💾 Save Selection</button>
        <div id="selectionStatus"></div>
    </div>
</div>

<div class="section">
    <h2>Upload Background</h2>
    <input type="file" id="bg" accept="image/*">
    <p id="bgStatus"></p>
</div>

<button onclick="generate()" style="padding: 15px 30px; font-size: 18px;">🚀 Generate</button>

<script src="/static/script.js"></script>

</body>
</html>
